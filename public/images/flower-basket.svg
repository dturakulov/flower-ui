  <ellipse cx="122" cy="176" rx="34" ry="20" transform="rotate(-24 122 176)" fill="#3E8E55"/>
  <ellipse cx="238" cy="176" rx="34" ry="20" transform="rotate(24 238 176)" fill="#3E8E55"/>
